[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabula-rag"
version = "1.0.0"
description = "Grounded RAG over proprietary documents, with claim-level verification and abstention."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohan Sriram Kunamsetty" }]
keywords = ["rag", "retrieval", "llm", "rocm", "amd", "mi300x", "hallucination"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "typer>=0.12",
]

[project.optional-dependencies]
contract = ["pypdf>=4.2", "python-docx>=1.1", "openpyxl>=3.1", "pillow>=10.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10",
       "pypdf>=4.2", "python-docx>=1.1", "openpyxl>=3.1", "pillow>=10.3"]

[project.scripts]
tabula-rag = "tabula_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabula_rag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:tabula_rag.*"]

[tool.coverage.run]
source = ["tabula_rag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "D"]
ignore = ["D203", "D213", "D406", "D407", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"src/tabula_rag/contract/answer.py" = ["E501"]  # the model prompt is prose
"tests/*" = ["D", "ARG", "SIM117", "RUF001", "S101", "SLF001", "B008", "E501"]
"scripts/*" = ["D102", "D103", "T201", "S101", "E501"]
"benchmarks/*" = ["T201", "D301", "E501"]
"src/tabula_rag/cli.py" = ["B008", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
packages = ["tabula_rag"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "openpyxl", "openpyxl.*", "PIL", "PIL.*", "torch", "torch.*"]
ignore_missing_imports = true
