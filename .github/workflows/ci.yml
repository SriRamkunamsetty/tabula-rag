name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts benchmarks app.py

      - name: Ruff (format check)
        run: ruff format --check src tests scripts benchmarks app.py

      - name: mypy (strict)
        run: mypy

      - name: pytest with coverage
        run: pytest -q --cov=tabula_rag --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Offline demo (no GPU) smoke test
        run: |
          python -m tabula_rag.cli demo | tee demo.out
          grep -q "ABSTAIN" demo.out    # unanswerable question must be refused
          grep -q "CONFLICT" demo.out   # rulebook/errata disagreement must be caught

      - name: Contract-mode self-check (real subprocesses, real HTTP, scripted model)
        run: python scripts/contract_selfcheck.py   # exits non-zero unless it scores full marks in time

  ablation-and-benchmark:
    name: RAG ablation + pipeline benchmark (no GPU)
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run ablation ladder
        run: python scripts/run_ablation.py | tee ablation.out
      - name: Ablation sanity — cited rung must beat no-retrieval
        run: |
          python -c "
          import re
          text = open('ablation.out').read()
          rows = {m.group(1): float(m.group(2)) for m in re.finditer(r'\| (\S+[\S ]*?) \| \d+ \| ([\d.]+)%', text)}
          assert rows['cited'] > rows['no-retrieval'], rows
          "
      - name: Run harness-only benchmark
        run: python benchmarks/bench_pipeline.py --requests 40 --concurrency 8
      - uses: actions/upload-artifact@v4
        with:
          name: ablation-and-benchmark-results
          path: |
            docs/rag_ablation.md
            benchmarks/results.json
          retention-days: 30

  submission-dockerfile-lint:
    name: lint the ROCm submission Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.submission
          failure-threshold: error

  docker-build:
    name: build container image
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tabula-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
